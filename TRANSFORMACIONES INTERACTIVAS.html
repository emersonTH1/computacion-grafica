<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Transformaciones 3D</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial;
}

/* 📌 PANEL DE CONTROLES */
.panel {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0,0,0,0.6);
    color: white;
    padding: 15px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.6;
}

/* 🔥 FLECHAS VISUALES */
.flechas {
    position: absolute;
    bottom: 20px;
    left: 20px;
    display: grid;
    grid-template-columns: 50px 50px 50px;
    gap: 5px;
}

.boton {
    width: 50px;
    height: 50px;
    background: rgba(0,0,0,0.6);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 20px;
}
</style>

</head>
<body>

<!-- 📌 INSTRUCCIONES -->
<div class="panel">
<b>CONTROLES:</b><br>
⬆️⬇️⬅️➡️ → Mover<br>
Q / E → Rotar<br>
W / S → Escalar
</div>

<!-- 🔥 FLECHAS VISUALES -->
<div class="flechas">
    <div></div>
    <div class="boton">↑</div>
    <div></div>

    <div class="boton">←</div>
    <div></div>
    <div class="boton">→</div>

    <div></div>
    <div class="boton">↓</div>
    <div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Cubo
const cube = new THREE.Mesh(
    new THREE.BoxGeometry(),
    new THREE.MeshNormalMaterial()
);
scene.add(cube);

// Controles
let keys = {};
document.addEventListener("keydown", e => keys[e.key]=true);
document.addEventListener("keyup", e => keys[e.key]=false);

function animate(){
    requestAnimationFrame(animate);

    // 🔹 TRASLACIÓN
    if(keys["ArrowUp"]) cube.position.y += 0.05;
    if(keys["ArrowDown"]) cube.position.y -= 0.05;
    if(keys["ArrowLeft"]) cube.position.x -= 0.05;
    if(keys["ArrowRight"]) cube.position.x += 0.05;

    // 🔹 ROTACIÓN
    if(keys["q"]) cube.rotation.y -= 0.05;
    if(keys["e"]) cube.rotation.y += 0.05;

    // 🔹 ESCALA
    if(keys["w"]) {
        cube.scale.x += 0.01;
        cube.scale.y += 0.01;
        cube.scale.z += 0.01;
    }
    if(keys["s"]) {
        cube.scale.x -= 0.01;
        cube.scale.y -= 0.01;
        cube.scale.z -= 0.01;
    }

    renderer.render(scene,camera);
}

animate();
</script>

</body>
</html>
