<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Computación Gráfica</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #4facfe, #00f2fe);
        color: white;
        text-align: center;
    }

    h1 {
        margin: 40px 0;
    }

    .contenedor {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
    }

    .card {
        background: white;
        color: black;
        width: 250px;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-10px);
    }

    .card h2 {
        margin-bottom: 10px;
    }

    .boton {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background-color: #4facfe;
        color: white;
        text-decoration: none;
        border-radius: 8px;
    }

    .boton:hover {
        background-color: #0077ff;
    }
</style>
</head>

<body>

<h1>Mis Figuras - Computación Gráfica</h1>

<div class="contenedor">

    <div class="card">
        <h2>Figura Circular</h2>
        <p>Ejemplo de círculo</p>
        <a href="figura-circular.html" class="boton">Ver</a>
    </div>

    <div class="card">
        <h2>Figura Cuadrado</h2>
        <p>Ejemplo de cuadrado</p>
        <a href="cuadrado.html" class="boton">Ver</a>
    </div>

    <div class="card">
        <h2>Triángulo</h2>
        <p>Ejemplo de triángulo</p>
        <a href="triangulo.html" class="boton">Ver</a>
    </div>

    <div class="card">
        <h2>Rectángulo</h2>
        <p>Ejemplo de rectángulo</p>
        <a href="rectangulo.html" class="boton">Ver</a>
    </div>

    <div class="card">
        <h2>Otra Figura</h2>
        <p>Ejemplo adicional</p>
        <a href="otra.html" class="boton">Ver</a>
    </div>

</div>

</body>
</html>
